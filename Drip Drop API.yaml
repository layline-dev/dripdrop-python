    PatchedContact:
      type: object
      description: |-
        Serializer mixin that adds tag support to any model serializer.

        The target model must have a ManyToManyField named `tags` pointing to tags.Tag.

        Write request format: {"tags": ["<tag-uuid>", ...]}
        Read response format: {"tags": [{"uuid": "...", "name": "...", ...}, ...]}
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        primary_email:
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
          nullable: true
        primary_phone:
          allOf:
          - $ref: '#/components/schemas/PhoneNumber'
          nullable: true
        custom_fields:
          type: object
          additionalProperties: {}
        tags:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
    PatchedCustomFieldDefinition:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
          description: Human-readable label for the custom field
          maxLength: 255
        key:
          type: string
          description: Machine-friendly identifier (e.g., 'company_name'). Auto-generated
            from display name if omitted.
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        target_model:
          type: string
          writeOnly: true
          description: Target model in 'app_label.model' format (e.g., 'contacts.contact')
        target_model_display:
          type: string
          readOnly: true
        required:
          type: boolean
        description:
          type: string
          nullable: true
        options:
          nullable: true
          description: Configuration for the field (e.g., choices for 'choice' type,
            max_length for 'char')
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_archived:
          type: boolean
          title: Archived
        is_in_use:
          type: boolean
          readOnly: true
    PatchedPublicFlowEnrollment:
      type: object
      description: |-
        Serializer mixin that adds custom field support to any model serializer.

        The target model must have a `custom_data` JSONField.

        Usage:
            class ContactSerializer(CustomFieldSerializerMixin, BaseNestedModelSerializer):
                class Meta:
                    model = Contact
                    fields = [..., "custom_fields"]

        Read response format:
            "custom_fields": {
                "<field_uuid>": {
                    "value": <the_value>,
                    "name": "Company",
                    "field_type": "char",
                    "required": false
                }
            }

        Write request format:
            "custom_fields": {
                "<field_uuid>": <value>
            }
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/FlowEnrollmentStatusesEnum'
          readOnly: true
        flow_uuid:
          type: string
          format: uuid
        contact_uuid:
          type: string
          format: uuid
        custom_fields:
          type: object
          additionalProperties: {}
    PhoneNumber:
      type: object
      properties:
        number:
          type: string
          maxLength: 128
        sms_opted_out:
          type: boolean
          readOnly: true
      required:
      - number
      - sms_opted_out
