openapi: 3.0.3
info:
  title: Drip Drop API
  version: 1.0.0
  description: API for integrations with Drip Drop.Authenticate by passing your API
    key in the `X-API-Key` header.
paths:
  /schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - ApiKeyAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /v1/contacts/:
    get:
      operationId: contacts_list
      description: Retrieve a paginated list of contacts for your account.
      summary: List contacts
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - contacts
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
      operationId: contacts_create
      description: Create a new contact with optional email and phone number.
      summary: Create a contact
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Contact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Contact'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
  /v1/contacts/{uuid}/:
    get:
      operationId: contacts_retrieve
      description: Retrieve a single contact by UUID.
      summary: Get a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contacts
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
    put:
      operationId: contacts_update
      description: Replace all fields on an existing contact.
      summary: Update a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Contact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Contact'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
    patch:
      operationId: contacts_partial_update
      description: Update specific fields on an existing contact.
      summary: Patch a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContact'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
    delete:
      operationId: contacts_destroy
      description: Permanently delete a contact.
      summary: Delete a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - contacts
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /v1/contacts/bulk/:
    post:
      operationId: contacts_bulk_create
      description: |-
        Create up to 500 contacts in one request. Validation is all-or-nothing: if any contact fails validation, nothing is created and the errors identify each failing contact by its index.

        Duplicate handling follows your account's dedupe strategy and the `on_duplicate` flag:
        - `error` (default): if any row matches an existing contact or an earlier row in the same request, nothing is created and a 409 lists the conflicting rows.
        - `skip`: the non-duplicate rows are created and the duplicates are reported in `skipped`.

        Only rows that will actually be created are counted against your plan's contact quota.
      summary: Bulk create contacts
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicContactBulkCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicContactBulkCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicContactBulkCreateRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContactBulkCreateResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContactBulkCreateConflict'
          description: ''
  /v1/contacts/duplicates/:
    get:
      operationId: contacts_duplicates_list
      description: Report of contacts that already share a dedupe key (email / phone),
        grouped into clusters, scanned by your account's dedupe strategy. When the
        strategy is `none` it falls back to email+phone so the report is still useful
        for cleanup.
      summary: List duplicate contact clusters
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - contacts
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDuplicateClusterList'
          description: ''
    post:
      operationId: contacts_duplicates_create
      description: 'Dry run: given a list of contacts, report per-row whether each
        would be created or skipped as a duplicate under your account''s dedupe strategy
        — against both existing contacts and the other rows in the request. Nothing
        is created.'
      summary: Preview duplicates for incoming contacts
      tags:
      - contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicContactDuplicatePreviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicContactDuplicatePreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicContactDuplicatePreviewRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContactDuplicatePreviewResponse'
          description: ''
  /v1/custom-fields/:
    get:
      operationId: custom_fields_list
      description: Retrieve custom field definitions for your account. Optionally
        filter by target_model query parameter.
      summary: List custom field definitions
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - custom_fields
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomFieldDefinitionList'
          description: ''
    post:
      operationId: custom_fields_create
      description: Create a new custom field definition for a supported model.
      summary: Create a custom field definition
      tags:
      - custom_fields
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
  /v1/custom-fields/{uuid}/:
    get:
      operationId: custom_fields_retrieve
      description: Retrieve a single custom field definition by UUID.
      summary: Get a custom field definition
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom_fields
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
    put:
      operationId: custom_fields_update
      description: Replace all fields on an existing custom field definition.
      summary: Update a custom field definition
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom_fields
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinition'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
    patch:
      operationId: custom_fields_partial_update
      description: Update specific fields on an existing custom field definition.
      summary: Patch a custom field definition
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom_fields
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldDefinition'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
    delete:
      operationId: custom_fields_destroy
      description: Permanently delete a custom field definition.
      summary: Delete a custom field definition
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom_fields
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /v1/enrollments/:
    get:
      operationId: enrollments_list
      description: Retrieve all flow enrollments for your account. Optionally filter
        by flow and/or contact to look up an existing enrollment.
      summary: List enrollments
      parameters:
      - in: query
        name: contact_uuid
        schema:
          type: string
        description: Only return enrollments for this contact.
      - in: query
        name: flow_uuid
        schema:
          type: string
        description: Only return enrollments in this flow.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - enrollments
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicFlowEnrollmentList'
          description: ''
    post:
      operationId: enrollments_create
      description: Enroll a contact into a flow by providing flow_uuid and contact_uuid.
      summary: Enroll a contact
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlowEnrollment'
          description: ''
  /v1/enrollments/{uuid}/:
    put:
      operationId: enrollments_update
      description: Update an enrollment's custom fields. The flow and contact an enrollment
        belongs to cannot be changed.
      summary: Update an enrollment
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicFlowEnrollment'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlowEnrollment'
          description: ''
    patch:
      operationId: enrollments_partial_update
      description: Update specific custom fields on an enrollment. Values are merged
        into the existing custom field data.
      summary: Patch an enrollment
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublicFlowEnrollment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublicFlowEnrollment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublicFlowEnrollment'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlowEnrollment'
          description: ''
    delete:
      operationId: enrollments_destroy
      description: Remove a contact from a flow by enrollment UUID.
      summary: Unenroll a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - enrollments
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /v1/flows/:
    get:
      operationId: flows_list
      description: Retrieve all flows for your account.
      summary: List flows
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - flows
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicFlowList'
          description: ''
  /v1/flows/{uuid}/:
    get:
      operationId: flows_retrieve
      description: Retrieve a single flow by UUID.
      summary: Get a flow
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - flows
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlow'
          description: ''
  /v1/flows/{uuid}/create-contact-and-enroll/:
    post:
      operationId: flows_create_contact_and_enroll_create
      description: Create a new contact and enroll them in this flow. Returns an error
        if a contact with the provided email or phone already exists.
      summary: Create contact and enroll in flow
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - flows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactAndEnroll'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateContactAndEnroll'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContactAndEnroll'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactAndEnrollSuccess'
          description: ''
        '400':
          description: Validation error
        '404':
          description: Flow not found
        '429':
          description: Contact limit for your plan has been reached
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAlreadyExists'
          description: ''
components:
  schemas:
    Contact:
      type: object
      description: |-
        Serializer mixin that adds tag support to any model serializer.

        The target model must have a ManyToManyField named `tags` pointing to tags.Tag.

        Write request format: {"tags": ["<tag-uuid>", ...]}
        Read response format: {"tags": [{"uuid": "...", "name": "...", ...}, ...]}
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        primary_email:
          allOf:
          - $ref: '#/components/schemas/EmailAddress'
          nullable: true
        primary_phone:
          allOf:
          - $ref: '#/components/schemas/PhoneNumber'
          nullable: true
        custom_fields:
          type: object
          additionalProperties: {}
        tags:
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
      required:
      - created
      - first_name
      - modified
      - uuid
    ContactAlreadyExists:
      type: object
      properties:
        error:
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
      required:
      - contact
      - error
    CreateContactAndEnroll:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        custom_fields:
          type: object
          additionalProperties: {}
        enrollment_custom_fields:
          type: object
          additionalProperties: {}
          description: Custom field values for the enrollment this call creates, keyed
            by field UUID or key. The definitions must target flows.flowenrollment;
            `custom_fields` targets the contact.
        on_match:
          nullable: true
          description: |-
            Set to 'create' to create a new contact even when one already matches the account's dedupe strategy. Omit to return 409 on a match (default).

            * `create` - create
          allOf:
          - $ref: '#/components/schemas/OnMatchEnum'
      required:
      - first_name
    CreateContactAndEnrollSuccess:
      type: object
      properties:
        message:
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
        enrollment:
          $ref: '#/components/schemas/PublicFlowEnrollment'
      required:
      - contact
      - enrollment
      - message
    CustomFieldDefinition:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
          description: Human-readable label for the custom field
          maxLength: 255
        key:
          type: string
          description: Machine-friendly identifier (e.g., 'company_name'). Auto-generated
            from display name if omitted.
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        target_model:
          type: string
          writeOnly: true
          description: Target model in 'app_label.model' format (e.g., 'contacts.contact')
        target_model_display:
          type: string
          readOnly: true
        required:
          type: boolean
        description:
          type: string
          nullable: true
        options:
          nullable: true
          description: Configuration for the field (e.g., choices for 'choice' type,
            max_length for 'char')
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_archived:
          type: boolean
          title: Archived
        is_in_use:
          type: boolean
          readOnly: true
      required:
      - created
      - display_name
      - field_type
      - is_in_use
      - modified
      - target_model
      - target_model_display
      - uuid
    DuplicateCluster:
      type: object
      description: |-
        Serializes a dedup.DuplicateCluster (key + the contacts sharing it) for
        the duplicate report and the setting-change guard's blocked payload.
      properties:
        key_type:
          type: string
        key_value:
          type: string
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateClusterContact'
          readOnly: true
      required:
      - contacts
      - key_type
      - key_value
    DuplicateClusterContact:
      type: object
      description: One contact inside a duplicate cluster (report + guard payload).
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
      required:
      - email
      - name
      - phone
      - uuid
    EmailAddress:
      type: object
      properties:
