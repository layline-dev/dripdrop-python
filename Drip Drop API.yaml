          type: string
          format: uuid
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        email_opted_out:
          type: boolean
          readOnly: true
      required:
      - created
      - email
      - email_opted_out
      - modified
      - uuid
    FieldTypeEnum:
      enum:
      - char
      - text
      - integer
      - decimal
      - boolean
      - date
      - datetime
      - email
      - url
      - choice
      type: string
      description: |-
        * `char` - Text
        * `text` - Long Text
        * `integer` - Integer
        * `decimal` - Decimal
        * `boolean` - Boolean
        * `date` - Date
        * `datetime` - Date & Time
        * `email` - Email
        * `url` - URL
        * `choice` - Single Choice
    FlowEnrollmentStatusesEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Not Started
        * `1` - Active
        * `2` - Paused
        * `3` - Error
        * `4` - Completed
        * `5` - Processing
        * `6` - Unsubscribed
    FlowStatusEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      description: |-
        * `0` - Draft
        * `1` - Scheduled
        * `2` - Active
        * `3` - Paused
        * `4` - Complete
        * `5` - Archived
    ImportResolution:
      type: object
      description: Per-row dedupe outcome in the import dry-run preview (aligned by
